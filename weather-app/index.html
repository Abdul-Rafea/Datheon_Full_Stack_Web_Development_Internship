<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body class="weather-page" id="weather-page">
    <header class="weather-header">
        <h1 class="weather-title">Weather</h1>
        <p class="weather-subtitle">A clear look at the weather, wherever you are.</p>
    </header>

    <main>
        <form class="weather-search-container" id="weather-search-form">
            <input type="search" id="weather-search-input" class="weather-input" placeholder="Search for a city..." aria-label="City name" autocomplete="off">
            <button type="submit" id="weather-search-button" class="weather-button">Search</button>
        </form>

        <div id="weather-error-banner" class="weather-error-banner" role="alert"></div>

        <div id="weather-spinner-container" class="weather-spinner-container" role="status" aria-live="polite">
            <div class="weather-spinner" aria-hidden="true"></div>
            <p>Loading weather...</p>
        </div>

        <section id="weather-dashboard" class="weather-dashboard" aria-label="Weather forecast">
            <div class="weather-current-card">
                <h2 id="weather-location-heading" class="weather-location-heading">--</h2>
                <p id="weather-condition-text" class="weather-condition-text">--</p>
                <div id="weather-temp-display" class="weather-temp-display">--°C</div>

                <div class="weather-telemetry-grid">
                    <div class="weather-metric-card">
                        <span class="weather-metric-label">Humidity</span>
                        <span id="weather-humidity-value" class="weather-metric-value">--%</span>
                    </div>
                    <div class="weather-metric-card">
                        <span class="weather-metric-label">Wind Speed</span>
                        <span id="weather-wind-value" class="weather-metric-value">-- km/h</span>
                    </div>
                    <div class="weather-metric-card">
                        <span class="weather-metric-label">Pressure</span>
                        <span id="weather-pressure-value" class="weather-metric-value">-- hPa</span>
                    </div>
                </div>
            </div>

            <div class="weather-forecast-section">
                <h3 class="weather-forecast-heading">5-Day Forecast</h3>
                <div id="weather-forecast-container" class="weather-forecast-container">
                    <!-- Forecast cards are added here. -->
                </div>
            </div>
        </section>
    </main>
</body>
</html>
